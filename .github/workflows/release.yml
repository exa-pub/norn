name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build-docker:
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/norn ./cmd/norn

      - name: Build Docker image
        run: |
          docker build -t norn:ci .
          docker save norn:ci -o norn-ci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: norn-docker-image
          path: norn-ci.tar

  test-e2e:
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: norn-docker-image
          path: .

      - name: Load Docker image
        run: docker load -i norn-ci.tar

      - name: Run e2e tests
        run: NORN_E2E_IMAGE=norn:ci go test -v -timeout 15m ./tests/e2e/...

  release:
    needs: [test-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: norn-docker-image
          path: .

      - name: Load Docker image
        run: docker load -i norn-ci.tar

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag norn:ci ghcr.io/exa-pub/norn:${GITHUB_REF_NAME}
          docker tag norn:ci ghcr.io/exa-pub/norn:latest
          docker push ghcr.io/exa-pub/norn:${GITHUB_REF_NAME}
          docker push ghcr.io/exa-pub/norn:latest
